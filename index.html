<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5fbff">
  <title>Bronze English</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar">
    <div class="topbarIn">
      <div class="brand">
        <img src="mascot.svg" alt="mascot">
        <span>Bronze English</span>
      </div>
      <div class="topActions">
        <button class="toggle" id="bgmToggle">🎵 BGM ON</button>
        <button class="toggle" id="seToggle">🔔 SE ON</button>
      </div>
    </div>
  </div>

  <div class="app">
    <section id="home">
      <div class="hero">
        <div class="heroGrid">
          <div>
            <div class="heroTitle">☁️ 全レッスン <span style="font-size:16px;font-weight:800;opacity:.95">かわいい青色版</span></div>
            <div class="heroSub">単語 → リスニング → 英語Q&A → 文法 → 並び替え → チャレンジまで、Lessonごとにしっかり練習。</div>
            <div class="heroStats">
              <div class="stat"><div>クリア</div><b id="clearCount">0</b><div>Lessons</div></div>
              <div class="stat"><div>バッジ</div><b id="badgeCount">0</b><div>Collected</div></div>
              <div class="stat"><div>BGM</div><b>10</b><div>Random tracks</div></div>
            </div>
          </div>
          <div class="restaurant">
            <div class="emoji" id="restEmoji">🛒</div>
            <div class="name" id="restName">やたいスタンド</div>
            <div class="sub">Lessonをクリアするとお店が成長します。<br><span id="trackName">BGM: -</span></div>
          </div>
        </div>
      </div>

      <div class="cards" id="cards"></div>
      <div class="badges">
        <h4>ごほうびバッジ</h4>
        <div class="badgeList" id="badgeList"></div>
      </div>
    </section>

    <section id="play" class="hidden playWrap">
      <div class="navRow">
        <button class="back" onclick="goHome()">← Lesson一覧</button>
        <div class="navTitle" id="playNav">Lesson</div>
      </div>

      <div class="panel">
        <div class="headline">
          <h2 id="playTitle"></h2>
          <div class="scorepill" id="scorePill">0 / 0</div>
        </div>

        <div class="stageRow">
          <div class="stageChip" id="chip1">① 単語4択</div>
          <div class="stageChip" id="chip2">② 単語リスニング</div>
          <div class="stageChip" id="chip3">③ 文章リスニング</div>
          <div class="stageChip" id="chip4">④ 間違い復習</div>
          <div class="stageChip" id="chip5">⑤ 英語で答える</div>
          <div class="stageChip" id="chip6">⑥ 文法穴埋め</div>
          <div class="stageChip" id="chip7">⑦ 並び替え</div>
          <div class="stageChip" id="chip8">⑧ 5問チャレンジ</div>
        </div>

        <div class="bar"><i id="barFill"></i></div>
        <div id="panelBody"></div>
      </div>
    </section>

    <div class="confetti" id="confetti"></div>
  </div>

  <script src="data.js"></script>
  <script src="audio.js"></script>
  <script src="app.js"></script>
  <script src="extras.js"></script>
  <script src="fixes.js"></script>
</body>
</html>
