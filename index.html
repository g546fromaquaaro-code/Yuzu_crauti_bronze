<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Yuzu Crauti Bronze</title><style>:root{--p:#f4ad7e;--bg:#fff9f5;--ink:#222;--mut:#777;--ok:#3aad74;--ng:#e75a5a}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink)}button{font:inherit}.app{max-width:900px;margin:auto;min-height:100vh}header{position:sticky;top:0;z-index:5;background:var(--p);color:#fff;padding:14px 16px;display:flex;justify-content:space-between}.brand{font-weight:900;font-size:21px}.pill{background:#fff;color:#333;border-radius:999px;padding:7px 11px;font-weight:800;font-size:13px}main{padding:16px 14px 70px}.hero,.lesson,.panel{background:#fff;border-radius:22px;box-shadow:0 8px 24px #6b463018}.hero{padding:18px}.hero h1{margin:0 0 7px}.hero p{margin:0;color:var(--mut);line-height:1.55}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.lesson{border:0;padding:14px;text-align:left}.lesson b{font-size:18px}.ico{font-size:38px;margin:7px 0}.lesson small{color:var(--mut)}.hide{display:none!important}.back{border:0;background:#fff;border-radius:999px;padding:9px 13px;font-weight:800}.title{display:flex;justify-content:space-between;align-items:center;margin:17px 2px 10px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}.step{padding:9px 6px;border:0;border-radius:14px;background:#eee;font-weight:800}.step.on{background:var(--p);color:#fff}.step.done{background:#edf9f3;color:#238252}.panel{padding:18px;text-align:center}.sub{color:var(--mut);font-size:13px;font-weight:700}.q{font-size:28px;font-weight:900;margin:10px 0 17px}.emoji{font-size:82px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.choice{border:2px solid #eee;background:#fff;border-radius:16px;padding:14px 8px;font-weight:800}.choice.ok{border-color:var(--ok);background:#effaf4}.choice.ng{border-color:var(--ng);background:#fff0f0}.fb{min-height:28px;margin-top:10px;font-weight:900}.tokens,.answer{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:58px;padding:10px;border-radius:16px}.answer{background:#fff5ee;margin-bottom:12px}.token{border:0;background:#fff;border-radius:12px;padding:10px 13px;box-shadow:0 4px 12px #00000012;font-weight:800}.token.used{opacity:.35}.main{border:0;background:var(--p);color:#fff;border-radius:15px;padding:13px 18px;font-weight:900}.secondary{border:0;background:#eee;border-radius:15px;padding:13px 18px;font-weight:900}.row{display:flex;gap:8px;margin-top:12px}.row>*{flex:1}.bar{height:12px;background:#eee;border-radius:999px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd155,#ff9e69)}.result{font-size:64px}@media(min-width:720px){.grid{grid-template-columns:repeat(3,1fr)}}</style></head><body><div class="app"><header><div class="brand">Bronze English 🍔</div><div class="pill" id="hp">Lesson 1–10</div></header><main><section id="home"><div class="hero"><h1>予習・復習トレーニング</h1><p>①単語4択 → ②間違えた単語だけ復習 → ③文章並び替え。<b>同じ問題は1回の学習中に繰り返しません。</b></p></div><div class="grid" id="grid"></div></section><section id="play" class="hide"><button class="back" onclick="goHome()">← Lesson一覧</button><div class="title"><h2 id="lt"></h2><span id="score"></span></div><div class="steps"><button class="step" id="s1">① 単語4択</button><button class="step" id="s2">② 間違い復習</button><button class="step" id="s3">③ 並び替え</button></div><div class="bar"><i id="bar"></i></div><div class="panel" id="panel"></div></section></main></div><script>const L=[{n:1,t:"Food",i:"🍚",w:[["rice","ごはん","🍚"],["bread","パン","🍞"],["noodles","めん","🍜"],["hamburger","ハンバーガー","🍔"],["sandwich","サンドイッチ","🥪"],["spaghetti","スパゲッティ","🍝"]],p:["This is rice.","This is bread.","These are noodles.","This is a hamburger.","These are sandwiches.","This is spaghetti.","Is this bread?","Yes, it is.","No, it isn't."]},{n:2,t:"Snacks",i:"🍰",w:[["chocolate","チョコレート","🍫"],["potato chips","ポテトチップス","🍟"],["ice cream","アイスクリーム","🍨"],["jelly","ゼリー","🍮"],["cake","ケーキ","🎂"],["doughnut","ドーナツ","🍩"]],p:["This is chocolate.","These are potato chips.","This is ice cream.","This is jelly.","This is a cake.","This is a doughnut.","Do you like potato chips?","Yes, I do.","No, I don't."]},{n:3,t:"Vegetables 1",i:"🥕",w:[["carrot","ニンジン","🥕"],["cucumber","キュウリ","🥒"],["potato","ジャガイモ","🥔"],["pumpkin","カボチャ","🎃"],["onion","タマネギ","🧅"],["cabbage","キャベツ","🥬"]],p:["What am I?","I'm long.","I'm green.","This is a cucumber."]},{n:4,t:"Vegetables 2",i:"🥦",w:[["tomato","トマト","🍅"],["eggplant","ナス","🍆"],["broccoli","ブロッコリー","🥦"],["spinach","ホウレンソウ","🥬"],["green pepper","ピーマン","🫑"],["lettuce","レタス","🥬"]],p:["I like tomato.","What am I?","I'm green.","I'm a vegetable."]},{n:5,t:"Fruits",i:"🍎",w:[["apple","リンゴ","🍎"],["banana","バナナ","🍌"],["grapes","ブドウ","🍇"],["orange","オレンジ","🍊"],["lemon","レモン","🍋"],["strawberry","イチゴ","🍓"]],p:["Do you want some apples?","What am I?","I'm red.","I'm sweet.","I'm yellow.","I'm long.","I'm sour."]},{n:6,t:"Meat & Seafood",i:"🍗",w:[["beef","ぎゅうにく","🥩"],["pork","ぶたにく","🥓"],["chicken","とりにく","🍗"],["ham","ハム","🍖"],["sausage","ソーセージ","🌭"],["shrimp","エビ","🍤"]],p:["Do you like ham?","Yes, I do.","No, I don't.","There are many shrimp."]},{n:7,t:"Pets",i:"🐶",w:[["cat","ネコ","🐱"],["dog","イヌ","🐶"],["rabbit","ウサギ","🐰"],["goldfish","きんぎょ","🐠"],["hamster","ハムスター","🐹"],["ant","アリ","🐜"]],p:["This is a goldfish.","This is a hamster.","This is an ant.","I have a hamster.","I have a dog.","I have a goldfish.","Do you like hamsters?"]},{n:8,t:"Animals 1",i:"🦋",w:[["bee","ハチ","🐝"],["butterfly","チョウ","🦋"],["dragonfly","トンボ","🪰"],["bear","クマ","🐻"],["deer","シカ","🦌"],["squirrel","リス","🐿️"]],p:["Is it a bee?","Yes, it is.","No, it isn't.","What am I?","I'm small.","I like flowers.","I'm brown.","I like nuts."]},{n:9,t:"Animals 2",i:"🦁",w:[["zebra","シマウマ","🦓"],["elephant","ゾウ","🐘"],["giraffe","キリン","🦒"],["tiger","トラ","🐯"],["lion","ライオン","🦁"],["cow","ウシ","🐄"]],p:["Is this a lion?","Yes, it is.","No, it isn't.","What am I?","I'm black and white.","I eat grass."]},{n:10,t:"Animals 3",i:"🐴",w:[["goat","ヤギ","🐐"],["pig","ブタ","🐷"],["horse","ウマ","🐴"],["sheep","ヒツジ","🐑"],["snake","ヘビ","🐍"]],p:["It is a snake.","What am I?","I'm big.","I like grass."]}];const sh=a=>[...a].sort(()=>Math.random()-.5);let lesson=null,stage=1,queue=[],idx=0,mistakes=[],right=0,sentenceQueue=[],picked=[];function renderGrid(){grid.innerHTML=L.map(l=>`<button class="lesson" onclick="start(${l.n})"><b>Lesson ${l.n}</b><div class="ico">${l.i}</div><div>${l.t}</div><small>${l.w.map(x=>x[0]).join(" ・ ")}</small></button>`).join("")}function start(n){lesson=L[n-1];stage=1;queue=sh(lesson.w.map((w,i)=>i));idx=0;mistakes=[];right=0;sentenceQueue=sh(lesson.p.map((p,i)=>i));home.classList.add("hide");play.classList.remove("hide");lt.textContent=`Lesson ${n} · ${lesson.t}`;render()}function goHome(){play.classList.add("hide");home.classList.remove("hide")}function progress(){const total=stage===1?queue.length:stage===2?Math.max(queue.length,1):sentenceQueue.length;const now=stage===3?idx:idx;bar.style.width=`${Math.min(100,(now/Math.max(total,1))*100)}%`;score.textContent=stage<3?`${right} 正解`:`${idx}/${total}`}function stepUI(){[s1,s2,s3].forEach((x,i)=>{x.className="step"+(i+1===stage?" on":i+1<stage?" done":"")})}function choicesFor(correct){const others=sh(L.flatMap(x=>x.w.map(w=>w[0])).filter(x=>x!==correct));return sh([correct,...others.slice(0,3)])}function render(){stepUI();progress();if(stage===1||stage===2)return vocab();return sentence()}function vocab(){if(idx>=queue.length){if(stage===1){stage=2;queue=[...new Set(mistakes)];idx=0;if(!queue.length){stage=3;idx=0;}return render()}stage=3;idx=0;return render()}const wi=queue[idx],w=lesson.w[wi],opts=choicesFor(w[0]);panel.innerHTML=`<div class="sub">${stage===1?"単語4択":"間違えた単語だけ復習"} ${idx+1}/${queue.length}</div><div class="emoji">${w[2]}</div><div class="q">${w[1]}</div><div class="choices">${opts.map(x=>`<button class="choice" onclick="answerWord(this,'${x.replaceAll("'","\\'")}',${wi})">${x}</button>`).join("")}</div><div class="fb" id="fb"></div>`}function answerWord(btn,ans,wi){const correct=lesson.w[wi][0],ok=ans===correct;document.querySelectorAll(".choice").forEach(b=>b.disabled=true);if(ok){btn.classList.add("ok");fb.textContent="正解！ 🎉";right++}else{btn.classList.add("ng");[...document.querySelectorAll(".choice")].find(b=>b.textContent===correct)?.classList.add("ok");fb.textContent=`正解は ${correct}`;if(stage===1)mistakes.push(wi)}idx++;setTimeout(render,700)}function sentence(){if(idx>=sentenceQueue.length){return finish()}const text=lesson.p[sentenceQueue[idx]],words=text.replace(/[?.]/g,"").split(/\s+/);picked=[];const tokens=sh(words.map((w,i)=>({w,i,id:Math.random()})));panel.innerHTML=`<div class="sub">文章並び替え ${idx+1}/${sentenceQueue.length}</div><div class="q">正しい順番に並べよう</div><div class="answer" id="ans"></div><div class="tokens" id="tokens">${tokens.map(t=>`<button class="token" data-id="${t.id}" onclick="pick(this,'${t.w.replaceAll("'","\\'")}')">${t.w}</button>`).join("")}</div><div class="row"><button class="secondary" onclick="undo()">1つ戻す</button><button class="main" onclick='checkSentence(${JSON.stringify(text)})'>答える</button></div><div class="fb" id="fb"></div>`}function pick(btn,w){if(btn.classList.contains("used"))return;btn.classList.add("used");picked.push({w,id:btn.dataset.id});drawAnswer()}function undo(){const x=picked.pop();if(!x)return;document.querySelector(`[data-id="${x.id}"]`)?.classList.remove("used");drawAnswer()}function drawAnswer(){ans.textContent=picked.map(x=>x.w).join(" ")}function checkSentence(correct){const base=correct.replace(/[?.]/g,"").trim(),mine=picked.map(x=>x.w).join(" ").trim();if(mine===base){fb.textContent="正解！ ✨";right++;idx++;setTimeout(render,700)}else{fb.textContent=`もう一度！ 正解：${correct}`}}function finish(){stepUI();bar.style.width="100%";panel.innerHTML=`<div class="result">🏆</div><div class="q">Lesson ${lesson.n} 完了！</div><p>単語は1回ずつ出題し、間違いだけ復習しました。文章も重複なしです。</p><div class="row"><button class="secondary" onclick="start(${lesson.n})">もう一度</button><button class="main" onclick="goHome()">Lesson一覧へ</button></div>`}renderGrid();</script></body></html>
