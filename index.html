function speak(x){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(x);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}function all(){return L.flatMap(l=>l.w.map(w=>({n:l.n,e:w[0],j:w[1],i:w[2]})))}function sample(a,n){return [...a].sort(()=>Math.random()-.5).slice(0,n)}function ding(ok){try{let a=new AudioContext,o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=ok?720:220;g.gain.value=.08;o.start();o.stop(a.currentTime+.18)}catch(e){}}
function update(){let stars=L.reduce((x,l)=>x+st(l.n).s,0),done=L.filter(l=>st(l.n).s>0).length;$('#stars').textContent=stars;$('#hp').textContent=done+' / 10 Lessons';$('#bar').style.width=done*10+'%';$('#rate').textContent=S.a?Math.round(S.ok/S.a*100)+'%':'0%';$('#miss').textContent=S.m.length;$('#grid').innerHTML=L.map(l=>`<button class="lesson" onclick="openL(${l.n})"><div class="top"><span>Lesson ${l.n}</span><span>${'⭐'.repeat(st(l.n).s)}${'☆'.repeat(3-st(l.n).s)}</span></div><div class="ico">${l.i} ${l.t}</div><small>${l.w.map(x=>x[0]).join(' ・ ')}</small></button>`).join('')}
function home(){$('#home').classList.remove('hide');$('#lesson').classList.add('hide');$('#review').classList.add('hide');$('.tabs').classList.remove('hide');update();scrollTo(0,0)}function openL(n){cur=n;wi=0;ci=0;cs=0;$('#home').classList.add('hide');$('#review').classList.add('hide');$('#lesson').classList.remove('hide');$('#lt').textContent=`Lesson ${n} · ${L[n-1].t}`;mode('words');scrollTo(0,0)}function mode(m){$$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.m===m));if(m==='words')word();if(m==='quiz')quiz();if(m==='listen')listen();if(m==='speak')speaking();if(m==='patterns')patterns();if(m==='challenge'){ci=0;cs=0;challenge()}}
function word(){let l=L[cur-1],w=l.w[wi%l.w.length];$('#panel').innerHTML=`<div class="sub">${wi+1} / ${l.w.length}</div><div class="emoji">${w[2]}</div><div class="en">${w[0]}</div><div class="ja">${w[1]}</div><button class="say" onclick='speak(${JSON.stringify(w[0])})'>🔊 発音を聞く</button><div class="row"><button class="btn" onclick="wi=(wi-1+${l.w.length})%${l.w.length};word()">← 前へ</button><button class="btn main" onclick="nextW()">次へ →</button></div>`}function nextW(){let l=L[cur-1];wi=(wi+1)%l.w.length;if(wi===0)star(1);word()}function mk(local=true){let p=local?L[cur-1].w.map(w=>({n:cur,e:w[0],j:w[1],i:w[2]})):all(),a=p[Math.floor(Math.random()*p.length)],o=[a,...sample(all().filter(x=>x.e!==a.e),3)].sort(()=>Math.random()-.5);return{a,o}}
function quiz(){Q=mk();$('#panel').innerHTML=`<div class="sub">絵に合う英単語はどれ？</div><div class="emoji">${Q.a.i}</div><div class="choices">${Q.o.map(o=>`<button class="choice" onclick='ans(this,${JSON.stringify(o.e)},${JSON.stringify(Q.a.e)},"quiz")'>${o.e}</button>`).join('')}</div><div id="fb" class="fb"></div>`}function listen(){Q=mk();$('#panel').innerHTML=`<div class="sub">音を聞いて選ぼう</div><div class="q">🎧</div><button class="say" onclick='speak(${JSON.stringify(Q.a.e)})'>▶ もう一度</button><div class="choices" style="margin-top:13px">${Q.o.map(o=>`<button class="choice" onclick='ans(this,${JSON.stringify(o.e)},${JSON.stringify(Q.a.e)},"listen")'>${o.i}<br>${o.j}</button>`).join('')}</div><div id="fb" class="fb"></div>`;setTimeout(()=>speak(Q.a.e),300)}function ans(b,a,c,m){S.a++;let ok=a===c;if(ok){S.ok++;b.classList.add('ok');$('#fb').textContent='正解！ 🎉';st(cur).q++;if(st(cur).q>=5)star(2)}else{b.classList.add('ng');$('#fb').textContent='正解は '+c;S.m.unshift({n:cur,e:c})}ding(ok);save();setTimeout(m==='quiz'?quiz:listen,750)}
function patterns(){let l=L[cur-1];$('#panel').innerHTML=`<div class="sub">Lesson ${cur} の文型</div><div class="cards">${l.p.map(x=>`<div class="card"><b>${x}</b><br><button class="say" onclick='speak(${JSON.stringify(x)})'>🔊 聞く</button></div>`).join('')}</div>`}function speaking(){let l=L[cur-1],a=[...l.p,...l.w.map(x=>x[0])],t=a[Math.floor(Math.random()*a.length)];$('#panel').innerHTML=`<div class="sub">お手本をまねして言おう</div><div class="q">${t}</div><button class="say" onclick='speak(${JSON.stringify(t)})'>🔊 お手本</button><p></p><button class="mic" onclick='rec(${JSON.stringify(t)})'>🎤</button><div id="rec" class="rec">マイクを押して話してね</div>`}function rec(t){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$('#rec').textContent='このブラウザでは音声認識が使えません。声に出して練習してね。';return}let r=new R;r.lang='en-US';r.onresult=e=>{let x=e.results[0][0].transcript,cl=s=>s.toLowerCase().replace(/[^a-z ]/g,'').trim(),ok=cl(x)===cl(t)||cl(x).includes(cl(t));$('#rec').innerHTML='聞こえた英語：<b>'+x+'</b><br>'+(ok?'かなり近い！ ⭐':'もう一回ゆっくり');if(ok)star(3)};r.start()}
function challenge(){let l=L[cur-1];if(ci>=l.c.length){let pass=cs>=Math.ceil(l.c.length*.67);$('#panel').innerHTML=`<div class="emoji">${pass?'👑':'🌱'}</div><div class="en">${cs} / ${l.c.length}</div><div class="ja">${pass?'Lessonクリア！':'もう一度やってみよう'}</div><div class="row"><button class="btn" onclick="ci=0;cs=0;challenge()">もう一度</button><button class="btn main" onclick="${pass?'star(3);home()':'mode(\'words\')'}">${pass?'クリアして戻る':'単語を復習'}</button></div>`;return}let q=l.c[ci],opts=q[2];if(opts){$('#panel').innerHTML=`<div class="sub">仕上げ ${ci+1} / ${l.c.length}</div><div class="q">${q[0]}</div><div class="choices">${opts.map(x=>`<button class="choice" onclick='ca(this,${JSON.stringify(x)},${JSON.stringify(q[1])})'>${x}</button>`).join('')}</div><div id="fb" class="fb"></div>`}else{$('#panel').innerHTML=`<div class="sub">仕上げ ${ci+1} / ${l.c.length}</div><div class="q">${q[0]}</div><input id="inp" autocomplete="off" autocapitalize="none" style="width:100%;max-width:420px;padding:13px;border:2px solid #ddd;border-radius:14px;text-align:center;font-size:21px"><br><button class="btn main" style="max-width:420px;margin-top:9px" onclick='ca(null,$("#inp").value,${JSON.stringify(q[1])})'>答える</button><div id="fb" class="fb"></div>`}}function ca(b,a,c){S.a++;let ok=(a||'').trim().toLowerCase()===c.toLowerCase();if(ok){S.ok++;cs++;if(b)b.classList.add('ok');$('#fb').textContent='正解！ ✨'}else{if(b)b.classList.add('ng');$('#fb').textContent='正解：'+c;S.m.unshift({n:cur,e:c})}ding(ok);save();ci++;setTimeout(challenge,800)}function star(x){if(st(cur).s<x){st(cur).s=x;save();$('#ls').textContent='⭐'.repeat(st(cur).s)}}
function quick(m){run={m,left:10,score:0};$('#home').classList.add('hide');$('#review').classList.add('hide');$('#lesson').classList.remove('hide');$('.tabs').classList.add('hide');$('#lt').textContent='ランダム10問';qr()}function qr(){if(run.left<=0){$('#panel').innerHTML=`<div class="emoji">🏆</div><div class="en">${run.score} / 10</div><div class="ja">おつかれさま！</div><button class="btn main" onclick="home()">ホームへ</button>`;return}if(run.m==='speak'){let a=all()[Math.floor(Math.random()*all().length)];$('#panel').innerHTML=`<div class="sub">あと ${run.left} 問</div><div class="emoji">${a.i}</div><div class="q">${a.e}</div><button class="say" onclick='speak(${JSON.stringify(a.e)})'>🔊 お手本</button><div class="row"><button class="btn main" onclick="run.score++;run.left--;qr()">言えた！</button><button class="btn" onclick="run.left--;qr()">むずかしい</button></div>`;return}Q=mk(false);let li=run.m==='listen'||(run.m==='mix'&&Math.random()<.5);$('#panel').innerHTML=`<div class="sub">あと ${run.left} 問</div><div class="q">${li?'🎧':Q.a.i}</div>${li?`<button class="say" onclick='speak(${JSON.stringify(Q.a.e)})'>▶ 聞く</button>`:''}<div class="choices" style="margin-top:12px">${Q.o.map(o=>`<button class="choice" onclick='qa(this,${JSON.stringify(o.e)},${JSON.stringify(Q.a.e)})'>${li?o.j+' '+o.i:o.e}</button>`).join('')}</div><div id="fb" class="fb"></div>`;if(li)setTimeout(()=>speak(Q.a.e),250)}function qa(b,a,c){S.a++;let ok=a===c;if(ok){S.ok++;run.score++;b.classList.add('ok')}else{b.classList.add('ng');S.m.unshift({n:Q.a.n,e:c})}ding(ok);save();run.left--;setTimeout(qr,650)}
function review(){$('#home').classList.add('hide');$('#lesson').classList.add('hide');$('#review').classList.remove('hide');let u=[];S.m.forEach(m=>{if(!u.some(x=>x.e===m.e))u.push(m)});$('#rlist').innerHTML=u.length?u.map(m=>{let w=all().find(x=>x.e===m.e);return `<div class="card" style="margin-bottom:9px"><b>${w?.i||'📝'} ${m.e}</b><br><small>Lesson ${m.n} · ${w?.j||''}</small> <button class="say" onclick='speak(${JSON.stringify(m.e)})'>🔊</button></div>`}).join(''):'<div class="panel">🎉 復習待ちはありません</div>'}update();
</script></body></html>
