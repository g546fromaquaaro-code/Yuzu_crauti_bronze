extなし');const c=new C();if(c.state==='suspended')await c.resume();const o=c.createOscillator(),g=c.createGain();o.frequency.value=660;o.type='sine';g.gain.value=.18;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.35);add('② Web Audio: 成功 state='+c.state);return true}catch(e){add('② Web Audio: 失敗 '+e.name+' '+e.message);return false}}async function speechTest(){try{if(!('speechSynthesis'in window))throw new Error('speechSynthesisなし');speechSynthesis.cancel();speechSynthesis.resume();const u=new SpeechSynthesisUtterance('Go to school');u.lang='en-US';u.rate=.8;u.onstart=()=>add('③ Speech: startイベント');u.onend=()=>add('③ Speech: endイベント');u.onerror=e=>add('③ Speech: error '+e.error);speechSynthesis.speak(u);add('③ Speech: speak()実行');return true}catch(e){add('③ Speech: 失敗 '+e.name+' '+e.message);return false}}wavBtn.onclick=wavTest;webBtn.onclick=webTest;speechBtn.onclick=speechTest;allBtn.onclick=async()=>{log.textContent='';await wavTest();setTimeout(webTest,700);setTimeout(speechTest,1500)};</script></body></html>
